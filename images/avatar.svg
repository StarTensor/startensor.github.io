<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d2d"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#238636"/>
      <stop offset="100%" style="stop-color:#2ea043"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#30363d" stroke-width="2"/>
  <!-- Hair -->
  <ellipse cx="100" cy="72" rx="55" ry="50" fill="url(#hair)"/>
  <rect x="45" y="70" width="110" height="30" fill="url(#hair)"/>
  <!-- Face -->
  <ellipse cx="100" cy="105" rx="42" ry="46" fill="#f0d5b0"/>
  <!-- Eyes -->
  <ellipse cx="82" cy="100" rx="8" ry="9" fill="white"/>
  <ellipse cx="118" cy="100" rx="8" ry="9" fill="white"/>
  <circle cx="84" cy="100" r="5" fill="#1a1a1a"/>
  <circle cx="120" cy="100" r="5" fill="#1a1a1a"/>
  <circle cx="86" cy="98" r="1.8" fill="white"/>
  <circle cx="122" cy="98" r="1.8" fill="white"/>
  <!-- Eyebrows -->
  <path d="M70 90 Q82 83 94 90" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M106 90 Q118 83 130 90" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M100 103 L96 112 Q100 115 104 112 Z" fill="#e0b890" stroke="none"/>
  <!-- Mouth (smile) -->
  <path d="M88 120 Q100 132 112 120" fill="none" stroke="#c4956a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Ears -->
  <ellipse cx="55" cy="105" rx="8" ry="12" fill="#f0d5b0"/>
  <ellipse cx="145" cy="105" rx="8" ry="12" fill="#f0d5b0"/>
  <!-- Shirt/Collar -->
  <path d="M55 145 L75 138 L100 150 L125 138 L145 145 L155 200 L45 200 Z" fill="url(#shirt)"/>
  <!-- Glasses frame -->
  <rect x="68" y="91" width="30" height="22" rx="6" fill="none" stroke="#30363d" stroke-width="2.5"/>
  <rect x="102" y="91" width="30" height="22" rx="6" fill="none" stroke="#30363d" stroke-width="2.5"/>
  <line x1="98" y1="100" x2="102" y2="100" stroke="#30363d" stroke-width="2.5"/>
  <line x1="68" y1="100" x2="58" y2="100" stroke="#30363d" stroke-width="2.5"/>
  <line x1="132" y1="100" x2="142" y2="100" stroke="#30363d" stroke-width="2.5"/>
</svg>
